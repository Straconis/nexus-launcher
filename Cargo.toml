[workspace]
resolver = "2"
members = [".", "crates/nexus-protocol", "crates/nexus-server"]

[workspace.package]
version = "0.2.0-alpha"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Straconis"]
repository = "https://github.com/Straconis/nexus-launcher"
rust-version = "1.99"

[package]
name = "nexus-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FOSS suite launcher for Straconis desktop tools"
repository.workspace = true
readme = "README.md"
authors.workspace = true
keywords = ["launcher", "egui", "github", "desktop"]
categories = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5"
eframe = { version = "0.31", optional = true, default-features = true }
flate2 = "1"
hex = "0.4"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
nexus-protocol = { path = "crates/nexus-protocol" }
keyring = "3"

[lib]
name = "nexus_launcher"
path = "src/lib.rs"

[[bin]]
name = "nexus-launcher"
path = "src/main.rs"
