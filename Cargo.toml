[package]
name = "nexus-launcher"
version = "0.1.1-alpha"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "FOSS suite launcher for Straconis desktop tools"
repository = "https://github.com/Straconis/nexus-launcher"
readme = "README.md"
authors = ["Straconis"]
keywords = ["launcher", "egui", "github", "desktop"]
categories = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5"
eframe = { version = "0.31", optional = true, default-features = true }
flate2 = "1"
hex = "0.4"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lib]
name = "nexus_launcher"
path = "src/lib.rs"

[[bin]]
name = "nexus-launcher"
path = "src/main.rs"
