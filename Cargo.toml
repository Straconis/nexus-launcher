[workspace]
resolver = "2"
members = [".", "crates/nexus-protocol", "crates/nexus-server"]

[workspace.package]
version = "0.5.3-alpha"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Straconis"]
repository = "https://github.com/Straconis/nexus-launcher"
rust-version = "1.99"

[package]
name = "nexus-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "FOSS suite launcher for Straconis desktop tools"
repository.workspace = true
readme = "README.md"
authors.workspace = true
keywords = ["launcher", "egui", "github", "desktop"]
categories = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image", "dep:wry", "dep:gtk", "dep:winit", "dep:raw-window-handle"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5"
eframe = { version = "0.31", optional = true, default-features = true }
flate2 = "1"
hex = "0.4"
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
nexus-protocol = { path = "crates/nexus-protocol" }
raw-window-handle = { version = "0.6", optional = true }
wry = { version = "0.57.1", optional = true }
# Select real OS credential stores; keyring without a platform feature uses a mock store.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
winit = { version = "0.30", default-features = false, features = ["x11"], optional = true }
keyring = { version = "3", features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[lib]
name = "nexus_launcher"
path = "src/lib.rs"

[[bin]]
name = "nexus-launcher"
path = "src/main.rs"
