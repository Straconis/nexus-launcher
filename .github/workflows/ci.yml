name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-ubuntu22-v1
      - name: Linux UI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libgtk-3-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p nexus-launcher -- --check
      - run: cargo build --workspace --release
      - run: ./scripts/package-linux.sh
      - name: Test Linux package
        run: |
          stage=$(mktemp -d)
          tar -xzf dist/nexus-launcher-linux-x86_64.tar.gz -C "$stage"
          (cd / && "$stage/nexus-launcher-linux-x86_64/nexus-launcher" --check)
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-launcher-linux-package
          path: dist/nexus-launcher-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: windows
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy, test, and build
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace --release
      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: ./scripts/install-inno-setup.ps1
      - name: Package portable ZIP and installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/nexus-launcher-setup-*-windows-x86_64.exe | Select-Object -First 1
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-launcher-windows-packages
          path: |
            dist/nexus-launcher-windows-x86_64.zip
            dist/nexus-launcher-setup-*-windows-x86_64.exe
          if-no-files-found: error
